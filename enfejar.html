<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>انفجار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b2a6b;--bg2:#050b1f;--accent:#4da3ff;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#fff;background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));transition:background 1.2s;overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.app.shake{animation:shake .6s}
@keyframes shake{10%,50%,90%{transform:translate(-9px,4px)}30%,70%{transform:translate(9px,-5px)}20%,60%{transform:translate(-6px,-4px)}40%,80%{transform:translate(6px,5px)}}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
h1 span{color:var(--accent);transition:color 1.2s}
.bal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 14px;text-align:left;backdrop-filter:blur(8px)}
.bal small{display:block;font-size:11px;opacity:.65;text-align:right}
.bal b{font-size:17px;font-weight:800}
.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-height:30px;direction:rtl}
.chip{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);direction:ltr}
.chip.c1{color:#ff6b6b}.chip.c2{color:#6bd5ff}.chip.c3{color:#5dff9a}.chip.c4{color:#ffd84d}.chip.c5{color:#ff9a3d}.chip.c6{color:#ffd700;border-color:#ffd70088}
.stage{position:relative;height:330px;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.28);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.mult{font-size:76px;font-weight:900;direction:ltr;line-height:1;text-shadow:0 0 30px currentColor;transition:color .6s}
.mult.boom{color:#ff3b3b;animation:pop .4s}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.now{margin-top:10px;font-size:16px;font-weight:600;opacity:.9;min-height:24px}
.toast{position:absolute;bottom:14px;left:12px;right:12px;padding:10px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;background:rgba(0,0,0,.55);border:1px solid var(--line);opacity:0;transform:translateY(10px);transition:.35s;backdrop-filter:blur(6px)}
.toast.show{opacity:1;transform:none}
.toast.win{border-color:#3dff8a;color:#7dffb0}.toast.lose{border-color:#ff4d4d;color:#ff8a8a}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(10px)}
label{font-size:12px;opacity:.7;display:block;margin-bottom:5px}
.inp{display:flex;align-items:center;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:800 20px Vazirmatn,Tahoma;padding:11px 0;direction:ltr;text-align:right}
.inp span{font-size:13px;opacity:.6;margin-right:8px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.quick button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;border-radius:11px;padding:8px 0;font:600 13px Vazirmatn,Tahoma;cursor:pointer}
.quick button:active{transform:scale(.95)}
.row{display:grid;grid-template-columns:1fr;gap:12px}
.main{border:0;border-radius:18px;padding:16px 10px;font:900 20px Vazirmatn,Tahoma;color:#fff;cursor:pointer;transition:.2s;box-shadow:0 10px 28px rgba(0,0,0,.35);line-height:1.3}
.main small{display:block;font-size:13px;font-weight:600;opacity:.9}
.main:active{transform:scale(.98)}
.start{background:linear-gradient(135deg,#2bd96b,#14a34e)}
.cash{background:linear-gradient(135deg,#ffb300,#ff7a00);animation:pulse 1s infinite}
.wait{background:linear-gradient(135deg,#475569,#334155);cursor:default;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,160,0,.25),0 10px 28px rgba(0,0,0,.35)}}
.foot{text-align:center;font-size:11px;opacity:.5;margin-top:2px}
@media(max-width:380px){.mult{font-size:60px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>💥 <span>انفجار</span></h1>
    <div class="bal"><small>موجودی</small><b id="bal">۰ تومان</b></div>
  </header>
  <div class="hist" id="hist"></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="center"><div class="mult" id="mult">×۱.۰۰</div><div class="now" id="now"></div></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="panel">
    <div>
      <label>مبلغ شرط (۱,۰۰۰ تا ۱,۰۰۰,۰۰۰ تومان)</label>
      <div class="inp"><input id="bet" inputmode="numeric" value="10,000"><span>تومان</span></div>
      <div class="quick">
        <button data-q="min">حداقل</button><button data-q="half">½</button><button data-q="dbl">×۲</button><button data-q="max">حداکثر</button>
      </div>
    </div>
    <div>
      <label>برداشت خودکار در ضریب (اختیاری، حداقل ۱.۰۱)</label>
      <div class="inp"><input id="auto" inputmode="decimal" placeholder="مثلاً 2.5"><span>×</span></div>
    </div>
    <div class="row"><button class="main start" id="main">شروع</button></div>
  </div>
  <div class="foot">بازی سرگرمی با موجودی مجازی — هیچ پول واقعی در کار نیست</div>
</div>

<script>
const $=id=>document.getElementById(id);
const fa=n=>Number(n).toLocaleString('fa-IR');
const MIN=1000,MAX=1000000,K=0.06,CAP=100;
let balance=5000000,state='idle',bet=0,crashPt=1,t0=0,mNow=1,tNow=0,inGame=false,auto=0,crashTime=0,lostThisRound=false,raf,particles=[],history=[];
try{const b=localStorage.getItem('enf_bal');if(b&&+b>=0)balance=+b;const h=JSON.parse(localStorage.getItem('enf_hist')||'[]');if(Array.isArray(h))history=h.slice(-10)}catch(e){}
const save=()=>{try{localStorage.setItem('enf_bal',balance);localStorage.setItem('enf_hist',JSON.stringify(history))}catch(e){}};

const cv=$('cv'),ctx=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}
let W,H;resize();addEventListener('resize',()=>{resize();draw()});

const tiers=[[2,'#4da3ff','#0b2a6b'],[5,'#3dff8a','#0b4a2c'],[10,'#ffd84d','#5a4708'],[30,'#ff9a3d','#6b2f06'],[Infinity,'#ffd700','#6b0d0d']];
const tier=m=>tiers.find(t=>m<t[0]);
const chipCls=m=>m<1.5?'c1':m<2?'c2':m<5?'c3':m<10?'c4':m<30?'c5':'c6';
function theme(m){const t=tier(m),s=document.documentElement.style;s.setProperty('--accent',t[1]);s.setProperty('--bg1',t[2]);$('mult').style.color=t[1]}

const money=()=>Math.floor(bet+bet*(mNow-1)/10);
function parseBet(){return parseInt($('bet').value.replace(/[^\d۰-۹]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))||0)}
function setBet(v){v=Math.max(MIN,Math.min(MAX,Math.floor(v)));$('bet').value=v.toLocaleString('en-US')}
function ui(){
  $('bal').textContent=fa(balance)+' تومان';
  const b=$('main');
  if(state==='running'&&inGame){b.className='main cash';b.innerHTML='برداشت<small>'+fa(money())+' تومان</small>'}
  else if(state==='running'){b.className='main wait';b.innerHTML='منتظر پایان دور...'}
  else{b.className='main start';b.textContent=state==='crashed'?'بازی مجدد':'شروع'}
  $('hist').innerHTML=history.slice().reverse().map(m=>`<div class="chip ${chipCls(m)}">${fa(m.toFixed(2))}×</div>`).join('');
}
function toast(msg,cls){const t=$('toast');t.textContent=msg;t.className='toast show '+cls;clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast',3500)}

function start(){
  bet=parseBet();
  if(bet<MIN||bet>MAX){setBet(bet);toast('مبلغ شرط باید بین ۱,۰۰۰ تا ۱,۰۰۰,۰۰۰ تومان باشد','lose');return}
  if(bet>balance){toast('موجودی کافی نیست','lose');return}
  auto=parseFloat(($('auto').value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace('٫','.'))||0;
  if(auto&&auto<1.01)auto=1.01;
  balance-=bet;save();
  const R=Math.random();
  crashPt=Math.min(CAP,Math.max(1,99/(100-R*100)));
  state='running';inGame=true;lostThisRound=false;mNow=1;tNow=0;particles=[];
  $('mult').className='mult';$('now').textContent='';
  t0=performance.now();ui();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function cash(m){
  if(!inGame)return;
  mNow=m;const win=money();balance+=win;inGame=false;save();
  toast(`🎉 برداشت در ×${fa(m.toFixed(2))}! ${fa(win)} تومان گرفتی`,'win');
  $('now').textContent='✅ برداشت شد: '+fa(win)+' تومان';ui();
}
function crash(){
  state='crashed';crashTime=performance.now();mNow=crashPt;
  history.push(+crashPt.toFixed(2));history=history.slice(-10);
  if(inGame){inGame=false;lostThisRound=true;toast(`💥 انفجار در ×${fa(crashPt.toFixed(2))}! اینبار نشد`,'lose')}
  $('mult').className='mult boom';$('mult').style.color='#ff3b3b';
  $('mult').textContent='×'+fa(crashPt.toFixed(2));
  $('now').textContent='💥 منفجر شد!';
  boom();save();ui();
  const a=$('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');
}
function loop(now){
  if(state==='running'){
    tNow=(now-t0)/1000;mNow=Math.exp(K*tNow);
    if(mNow>=crashPt){crash()}
    else{
      if(inGame&&mNow>=CAP)cash(CAP);
      else if(inGame&&auto&&mNow>=auto)cash(mNow);
      $('mult').textContent='×'+fa(mNow.toFixed(2));theme(mNow);
      if(inGame){$('now').textContent='قابل برداشت: '+fa(money())+' تومان';$('main').innerHTML='برداشت<small>'+fa(money())+' تومان</small>'}
    }
  }
  draw();
  if(state==='running'||particles.length)raf=requestAnimationFrame(loop);
}
function boom(){
  const p=curvePt();
  for(let i=0;i<110;i++){const a=Math.random()*6.283,s=2+Math.random()*9;
    particles.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:2+Math.random()*4,h:Math.random()*50})}
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function scale(){const tm=Math.max(10,tNow*1.12),mm=Math.max(2,mNow*1.15);return{tm,mm}}
function curvePt(){const{tm,mm}=scale(),pad=22;return{x:pad+(tNow/tm)*(W-pad*2),y:H-pad-((mNow-1)/(mm-1))*(H-pad*2)}}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(let i=1;i<6;i++){const y=H*i/6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let i=1;i<6;i++){const x=W*i/6;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  const col=state==='crashed'?'#ff3b3b':tier(mNow)[1];
  if(state!=='idle'){
    const{tm,mm}=scale(),pad=22,N=70,pts=[];
    const lastT=state==='crashed'?Math.log(crashPt)/K:tNow;
    for(let i=0;i<=N;i++){const t=lastT*i/N,m=Math.exp(K*t);pts.push([pad+(t/tm)*(W-pad*2),H-pad-((m-1)/(mm-1))*(H-pad*2)])}
    const end=pts[N];
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col+'66');g.addColorStop(1,col+'00');
    ctx.beginPath();ctx.moveTo(pts[0][0],H);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(end[0],H);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineJoin='round';ctx.shadowColor=col;ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
    if(state==='running'){ctx.beginPath();ctx.arc(end[0],end[1],7,0,6.283);ctx.fillStyle='#fff';ctx.shadowColor=col;ctx.shadowBlur=22;ctx.fill();ctx.shadowBlur=0}
  }
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.985;p.life-=.016;
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=`hsl(${p.h},100%,60%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.5,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state==='crashed'&&performance.now()-crashTime<250){ctx.fillStyle=`rgba(255,255,255,${.5*(1-(performance.now()-crashTime)/250)})`;ctx.fillRect(0,0,W,H)}
}

$('main').addEventListener('click',()=>{
  if(state==='running'){
    if(inGame)cash(mNow);return;
  }
  if(state==='crashed'&&lostThisRound&&false){}
  start();
});
// near-miss: tap on button right after the crash
$('main').addEventListener('pointerdown',()=>{
  if(state==='crashed'){const d=(performance.now()-crashTime)/1000;
    if(lostThisRound&&d<=1.2&&!$('main').dataset.nm){$('main').dataset.nm=1;toast(`😱 فقط ${fa(d.toFixed(1))} ثانیه دیر بودی!`,'lose');setTimeout(()=>delete $('main').dataset.nm,1500)}}
});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
  const v=parseBet()||MIN,q=b.dataset.q;
  setBet(q==='min'?MIN:q==='max'?Math.min(MAX,balance):q==='half'?v/2:v*2);
});
$('bet').addEventListener('input',e=>{const v=parseBet();e.target.value=v?v.toLocaleString('en-US'):''});
$('bet').addEventListener('blur',()=>setBet(parseBet()||MIN));
if(balance<MIN){balance=5000000;save()}
theme(1);ui();draw();
</script>
</body>
</html>
